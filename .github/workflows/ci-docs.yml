name: Build Docs

# Called only after the matching WASM bundle has passed its tests.
on:
  workflow_call:
    inputs:
      wasm-artifact:
        description: Tested WASM bundle artifact from this workflow run
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: viprs-docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.wasm-artifact }}
          path: dist/wasm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set weekly documentation cache key
        run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"

      - name: Restore Material for MkDocs cache
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install the tested web application into the documentation
        run: |
          (cd dist/wasm && sha256sum --check viprs-webapp-wasm.sha256)
          python -m zipfile -e dist/wasm/viprs-webapp-wasm.zip docs

      - name: Configure Git credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Install and deploy documentation
        run: |
          uv pip install --system -v -e ".[docs]"
          mkdocs gh-deploy --force
