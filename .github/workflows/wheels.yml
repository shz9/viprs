name: Wheels

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15-intel is an Intel runner; macos-15 is Apple Silicon.
        # Do not include macos-latest here because it can duplicate arm64 wheel
        # filenames and race/overwrite files when artifacts are merged before upload.
        os:
          [
            ubuntu-latest,
            windows-latest,
            macos-15-intel,
            macos-15,
          ]
    env:
      CIBW_BUILD: "cp311-* cp312-* cp313-*"
      CIBW_SKIP: "pp* cp36-* *-musllinux_* *win32 *_i686 *_s390x"

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist
        run: uv run --with build python -m build --sdist

      - name: Test install
        run: uv pip install --system dist/viprs*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
